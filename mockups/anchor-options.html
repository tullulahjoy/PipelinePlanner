class="board-help">Move activity or change a phase’s duration in whole weeks. Christmas pauses are recalculated. Use the controls for precise or keyboard-only adjustments.</p></div><aside class="controls-panel"><h3>Choose what to adjust</h3><label class="field-label">Procurement<select><option value="community-services" selected="">Community services procurement</option><option value="digital-services">Digital services procurement</option><option value="facilities-support">Facilities support procurement</option></select></label><fieldset class="mode-choice"><legend>Selection</legend><label><input type="radio" name="selection-mode">Whole procurement</label><label><input type="radio" name="selection-mode" checked="">One phase</label><label><input type="radio" name="selection-mode">Phase range</label></fieldset><div class="range-fields"><label class="field-label">Phase<select><option value="0">Market engagement</option><option value="1">Launch and EOI</option><option value="2">Dialogue with bidders</option><option value="4">Bid writing</option><option value="6">Evaluation</option><option value="7">Moderation</option><option value="8" selected="">Governance</option><option value="9">Contract award</option><option value="10">Off-site mobilisation</option><option value="12">On-site mobilisation</option></select></label></div><div class="selected-summary"><strong>Selected activity</strong><p>Governance</p><small>4 Feb 2030 to 21 Jun 2030</small></div><form class="duration-form" aria-labelledby="duration-title"><h4 id="duration-title">Change phase duration</h4><label class="field-label">Duration in whole weeks<input aria-label="Duration in whole weeks" min="1" max="5200" step="1" required="" type="number" value="20"></label><label class="field-label">Keep this date fixed<select><option value="start" selected="">Start date: 4 Feb 2030</option><option value="finish">Finish date: 21 Jun 2030</option></select></label><p class="help">Shortening frees time after this phase. Other n></footer></div></template>

"color":"#34654c","offset":0,"s":1926633600000,"e":1975017600000}],"anchorId":12,"axisStart":1878249600000,"axisEnd":1976832000000}</script>
  <script>
    const descriptions = {
      1: 'Compact card beneath the procurement selector. Its message changes with your selection, with a permission checkbox when needed.',
      2: 'The existing anchor box beneath the phase controls. Only its colours change. Use Show anchor box if it is out of view.',
    };
    const lockIcon = '<span class="anchor-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path><path d="M12 14v3"></path></svg></span>';
    const previews = document.getElementById('previews');
    const template = document.getElementById('workspace-template');
    const data = JSON.parse(document.getElementById('phase-data').textContent);
    const phases = data.phases;
    const state = { mode: 'phase', first: 8, last: 8, allowed: false, blocked: false };
    const frames = new Map();
    let activeOption = 1;
    const date = value => new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' }).format(value);
    const finish = phase => phase.kind === 'milestone' ? phase.s : phase.e - 3 * 86400000;
    const includesAnchor = () => phases.slice(state.first, state.last + 1).some(phase => phase.id === data.anchorId);
    function enable(node) {
      node.classList.add('mock-interactive');
      const controls = node.matches('input,select,button') ? [node] : node.querySelectorAll('input,select,button');
      controls.forEach(control => { control.removeAttribute('tabindex'); control.removeAttribute('aria-disabled'); });
    }
    function selectionChanged() {
      state.blocked = false;
      if (!includesAnchor()) state.allowed = false;
      renderAll();
    }
    function changeMode(mode) {
      const current = state.first;
      state.mode = mode;
      if (mode === 'whole') { state.first = 0; state.last = phases.length - 1; }
      if (mode === 'range') { state.first = 0; state.last = 9; }
      if (mode === 'phase') { state.first = phases[current].kind === 'phase' ? current : 8; state.last = state.first; }
      selectionChanged();
    }
    function createPhaseSelect(labelText, onChange) {
      const label = document.createElement('label');
      label.className = 'field-label'; label.append(labelText);
      const select = document.createElement('select'); select.setAttribute('aria-label', labelText);
      select.addEventListener('change', () => onChange(Number(select.value)));
      label.append(select);
      return label;
    }
    function updatePhaseFields(frame) {
      const fields = frame.querySelector('.range-fields');
      fields.hidden = state.mode === 'whole';
      if (state.mode === 'whole') return;
      if (fields.dataset.mode !== state.mode) {
        fields.replaceChildren(createPhaseSelect(state.mode === 'phase' ? 'Phase' : 'From phase', index => {
          state.first = index; state.last = state.mode === 'phase' ? index : Math.max(index, state.last); selectionChanged();
        }));
        if (state.mode === 'range') fields.append(createPhaseSelect('Through to phase', index => { state.last = index; selectionChanged(); }));
        fields.dataset.mode = state.mode;
      }
      fields.querySelectorAll('select').forEach((select, order) => {
        const available = phases.flatMap((phase, index) => phase.kind === 'phase' && (!order || index >= state.first) ? [new Option(phase.name, index)] : []);
        select.replaceChildren(...available); select.value = String(order ? state.last : state.first);
      });
      enable(fields);
    }
    function renderAll() {
      const included = includesAnchor();
      document.getElementById('anchor-state').value = included ? state.allowed ? 'allowed' : 'locked' : 'unaffected';
      document.getElementById('show-blocked').hidden = !included || state.allowed;
      document.getElementById('show-blocked').textContent = state.blocked ? 'Hide blocked-move message' : 'Show a blocked-move message';
      for (const [option, frame] of frames) {
        frame.querySelectorAll('.mode-choice input').forEach(input => { input.checked = input.value === state.mode; });
        updatePhaseFields(frame);
        const selected = phases.slice(state.first, state.last + 1);
        const start = Math.min(...selected.map(phase => phase.s)), end = Math.max(...selected.map(phase => phase.e));
        const summary = frame.querySelector('.selected-summary');
        summary.querySelector('p').textContent = phases[state.first].name + (state.first === state.last ? '' : ` through to ${phases[state.last].name}`);
        summary.querySelector('small').textContent = `${date(start)} to ${date(Math.max(...selected.map(finish)))}`;
        const duration = frame.querySelector('.duration-form');
        duration.hidden = state.mode !== 'phase';
        duration.querySelector('input').value = phases[state.first].weeks;
        const boundaries = duration.querySelector('select').options;
        boundaries[0].textContent = `Start date: ${date(phases[state.first].s)}`;
        boundaries[1].textContent = `Finish date: ${date(finish(phases[state.first]))}`;
        const anchor = frame.querySelector('[data-anchor-box]');
        const permission = anchor.querySelector('.anchor-permission');
        permission.hidden = !included; permission.querySelector('input').checked = state.allowed;
        if (option === 1) {
          anchor.querySelector('.anchor-heading span:last-child').textContent = included && state.allowed ? 'Anchor date can move' : 'Anchor date fixed';
          anchor.querySelector('.anchor-copy').textContent = !included ? 'Your selection leaves this date unchanged.' : state.allowed ? 'The anchor date will move with your selection.' : 'Moving this selection would also move the anchor date.';
        } else {
          anchor.querySelector('h4').textContent = state.allowed ? 'Anchor movement allowed' : 'Anchor locked';
          anchor.querySelector('[data-unchanged-note]').hidden = included;
        }
        const outline = frame.querySelector('.selection-drag');
        outline.style.left = `${(start - data.axisStart) / (data.axisEnd - data.axisStart) * 100}%`;
        outline.style.width = `${(end - start) / (data.axisEnd - data.axisStart) * 100}%`;
        outline.classList.toggle('is-locked', included && !state.allowed);
        outline.querySelector('.drag-grip').textContent = `⠿ Move selection${included && !state.allowed ? ' · Anchor locked' : ''}`;
        outline.querySelector('.drag-grip').setAttribute('aria-label', 'Selected activity, visual comparison only');
        frame.querySelector('[data-blocked-message]').hidden = !state.blocked;
      }
    }
    if (location.protocol === 'file:') {
      const workingDemo = document.querySelector('.comparison-top a');
      workingDemo.href = 'http://localhost:5173/mockups/pipeline-adjustment.html';
      workingDemo.title = 'Start npm.cmd run dev in the project terminal before opening the working demo.';
    }
    for (const option of [1, 2]) {
      const frame = document.createElement('section');
      frame.id = `option-${option}`;
      frame.className = 'preview-frame';
      frame.setAttribute('aria-label', `Option ${option}: ${document.querySelector(`[data-option="${option}"] strong`).textContent}`);
      frame.hidden = option !== 1;
      frame.append(template.content.cloneNode(true));
      const workspace = frame.querySelector('.adjustment-workspace');
      workspace.removeAttribute('role'); workspace.removeAttribute('aria-modal'); workspace.removeAttribute('tabindex');
      workspace.querySelector('.workspace-eyebrow').textContent = 'Pipeline adjustment';
      const idMap = new Map();
      frame.querySelectorAll('[id]').forEach(node => { idMap.set(node.id, `option-${option}-${node.id}`); node.id = idMap.get(node.id); });
      frame.querySelectorAll('[aria-labelledby],[aria-describedby]').forEach(node => {
        for (const attribute of ['aria-labelledby','aria-describedby']) if (node.hasAttribute(attribute)) node.setAttribute(attribute, node.getAttribute(attribute).split(' ').map(id => idMap.get(id) || id).join(' '));
      });
      frame.querySelectorAll('input[name]').forEach(node => { node.name = `option-${option}-${node.name}`; });
      frame.querySelectorAll('button,input,select,textarea').forEach(node => { node.tabIndex = -1; node.setAttribute('aria-disabled','true'); });
      const panel = frame.querySelector('.controls-panel');
      const scroller = document.createElement('div');
      scroller.className = 'panel-scroll'; scroller.tabIndex = 0; scroller.setAttribute('role','region'); scroller.setAttribute('aria-label','Scrollable editing controls');
      while (panel.firstChild) scroller.append(panel.firstChild);
      panel.append(scroller);
      let anchor = frame.querySelector('.anchor-box');
      if (option === 1) {
        anchor.remove(); anchor = document.createElement('section');
        anchor.className = 'anchor-card'; anchor.setAttribute('aria-label','Anchor date');
        anchor.innerHTML = `<div class="anchor-heading">${lockIcon}<span>Anchor date fixed</span></div><p class="anchor-event">Service responsibility transfers</p><strong class="anchor-date">20 January 2031</strong><p class="anchor-copy"></p>`;
        scroller.querySelector(':scope > .field-label').after(anchor);
      } else {
        anchor.querySelectorAll(':scope > small')[1].setAttribute('data-unchanged-note','');
      }
      anchor.setAttribute('data-anchor-box','');
      const permission = document.createElement('label');
      permission.className = 'anchor-permission';
      const checkbox = document.createElement('input'); checkbox.type = 'checkbox';
      checkbox.addEventListener('change', () => { state.allowed = checkbox.checked; state.blocked = false; renderAll(); });
      permission.append(checkbox, 'Allow this procurement’s anchor date to move'); anchor.append(permission); enable(permission);
      const modes = frame.querySelector('.mode-choice');
      modes.querySelectorAll('input').forEach((input, index) => { input.value = ['whole','phase','range'][index]; input.addEventListener('change', () => { if (input.checked) changeMode(input.value); }); });
      enable(modes);
      const error = document.createElement('p'); error.className = 'error-box'; error.setAttribute('role','alert'); error.setAttribute('data-blocked-message',''); error.hidden = true;
      error.textContent = option === 1 ? 'This selection includes the fixed anchor. Allow it to move or select activity that leaves it unchanged.' : 'The selection includes the locked anchor. Allow this anchor date to move, or choose phases that leave it in place.';
      frame.querySelector('.movement-form').after(error);
      previews.append(frame);
      frames.set(option, frame);
    }
    function showOption(option) {
      activeOption = option;
      document.querySelectorAll('.preview-frame').forEach(frame => { frame.hidden = frame.id !== `option-${option}`; });
      document.querySelectorAll('[data-option]').forEach(button => button.setAttribute('aria-pressed', String(Number(button.dataset.option) === option)));
      document.getElementById('option-description').textContent = descriptions[option];
      const frame = document.getElementById(`option-${option}`);
      frame.querySelector('.panel-scroll').scrollTop = 0;
      frame.querySelector('.board-area').scrollTop = 0;
      frame.querySelector('.custom-chart-scroll').scrollLeft = 60;
    }
    document.querySelectorAll('[data-option]').forEach(button => button.addEventListener('click', () => {
      const option = Number(button.dataset.option);
      history.replaceState(null,'',`#option-${option}`); showOption(option);
    }));
    document.getElementById('show-anchor').addEventListener('click', () => {
      frames.get(activeOption).querySelector('[data-anchor-box]').scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'instant' : 'smooth' });
    });
    document.getElementById('anchor-state').addEventListener('change', event => {
      const value = event.target.value;
      Object.assign(state, value === 'unaffected' ? { mode: 'phase', first: 8, last: 8, allowed: false, blocked: false } : { mode: 'whole', first: 0, last: phases.length - 1, allowed: value === 'allowed', blocked: false });
      renderAll();
    });
    document.getElementById('show-blocked').addEventListener('click', () => {
      state.blocked = !state.blocked; renderAll();
      if (state.blocked) frames.get(activeOption).querySelector('[data-blocked-message]').scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    });
    window.addEventListener('hashchange', () => showOption(Number(location.hash.match(/^#option-([12])$/)?.[1]) || 1));
    renderAll();
    showOption(Number(location.hash.match(/^#option-([12])$/)?.[1]) || 1);
  </script>
